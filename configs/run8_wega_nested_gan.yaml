# nested_gan, Deployment-Edition auf **Weg A** (einkanalig) -- run 8.
#
# Unterschied zu run 7 ist genau einer: der Datensatz. Statt des Proof-Fit-
# Datensatzes, dessen "sauberes" EEG die Ausgabe von AAS selbst ist, laeuft hier
# Weg A -- das Artefakt einer Aufnahme auf ein EEG aus einer **unabhaengigen**
# Quelle addiert. Damit ist FARM nicht mehr die Obergrenze: ein Modell kann es
# im Prinzip schlagen, was auf dem Proof-Fit-Datensatz strukturell unmoeglich ist.
#
# Einkanalig abgeleitet aus der dreikanaligen Fassung
# (output/weg_a_farm_v10_locked_512/), siehe
# tools/dataset_building/derive_single_channel_weg_a.py. Die dreikanalige Fassung
# bleibt bestehen; mit ihr kaemen zwei Hebel gleichzeitig ins Spiel -- die
# unabhaengige Clean-Quelle *und* der raeumliche Kontext -- und ein Unterschied
# im Ergebnis waere nicht zuzuordnen.
#
# **Der Split kommt aus dem Archiv, nicht aus val_ratio.** example_split bedeutet
# 0 Training, 1 Selektion, 2 gesperrter Holdout, -1 an der Nahtstelle verworfen.
# Der Holdout ist ausgeschnitten worden, damit eine Konfiguration nicht auf
# derselben Menge ausgewaehlt und berichtet wird, und wird von der Fabrik
# ausgeschlossen. val_ratio steht nur noch da, weil das Schema es verlangt.
#
# **Die Verlustgewichte sind fuer Weg A neu hergeleitet** und weichen damit von
# run 7 ab. Grund: velocity und acceleration teilen durch die Ableitungsenergie
# des sauberen Signals, und die unterscheidet sich zwischen den Datensaetzen um
# Groessenordnungen -- Proof-Fit hat RMS(d/dt)/RMS(clean) = 1,13 (die AAS-Ausgabe
# traegt ihren Hochfrequenzrest), Weg A hat 0,0087 (glattes EEG aus unabhaengiger
# Quelle). Mit den run-7-Gewichten waeren ueber 99,99 % des Gradienten der
# Beschleunigungsterm. Hergeleitet nach derselben Methode wie damals
# frequency_weight = 0,046: Terme am Identitaetsstart gegen den Amplitudenterm
# angeglichen, gemessen ueber 256 Beispiele, siehe
# tools/training/derive_wega_loss_weights.py und
# docs/research/run_8_wega_loss_weights.json.
#
# si_sdr und energy_ratio bleiben bei 1,0 -- beschraenkte Verhaeltnisterme, in
# run 7 ebenfalls nicht angeglichen.
#
# **Die Ankerwerte aus run 7 gelten hier nicht mehr.** Neu vermessen:
#
#     perfekt      -1,00     (unveraendert, Fixpunkt der Zielfunktion)
#     loeschen     +17 .. +25   (run 7: +3,046)
#     nichts tun   ~+11 000     (run 7: ~+43)
#
# Der Abstand zwischen "loeschen" und "nichts tun" ist hier viel groesser als in
# run 7, weil das Artefakt 41-mal ueber dem EEG liegt statt 3,3-mal. Das heisst
# auch: der Sprung von 11 000 auf 25 ist allein durch Loeschen zu haben. Ein Lauf,
# der dort stehenbleibt, hat nichts rekonstruiert -- die Zahl im Protokoll sieht
# trotzdem nach grossem Fortschritt aus.
#
# Die Packung bt1s muss zu PACKING der Familie passen -- sonst baut das
# Modell eine andere Form, als der Datensatz liefert.
#
#   uv run facet-train fit --config configs/run8_wega_nested_gan.yaml

model:
  framework: pytorch
  factory: facet.models.nested_gan_deployment_edition.training:build_model
  kwargs:
    inner_channels: 48
    inner_blocks: 4
    inner_heads: 4
    inner_expansion: 2.0
    outer_base_channels: 32
    n_fft: 64
    hop_length: 16
    win_length: 64
  loss_factory: facet.models.nested_gan_deployment_edition.training:build_loss
  loss_kwargs:
    name: recovered_clean
    amplitude_weight: 1.0
    velocity_weight: 0.00017043934156734243
    acceleration_weight: 1.3597193525429164e-05
    frequency_weight: 17.220293178786243
    si_sdr_weight: 1.0
    si_sdr_max: 30.0
    freq_band:
    - 1.0
    - 70.0
  device: cuda
data:
  dataset_factory: facet.training.deployment_data:build_weg_a_packed_dataset
  kwargs:
    path: ./output/weg_a_farm_v10_locked_1ch/weg_a_spatiotemporal_dataset.npz
    packing: bt1s
  eeg_only: true
training:
  model_name: NestedGanWegA1ch
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 80
  batch_size: 64
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 2
  save_last: true
early_stopping:
  monitor: val_loss
  mode: min
  patience: 20
  min_delta: 0.0
  min_delta_rel: 0.001
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/nested_gan_wega.ts
  write_inference_config: false

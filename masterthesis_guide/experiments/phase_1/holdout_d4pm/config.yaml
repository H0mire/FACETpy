model:
  framework: pytorch
  factory: facet.models.masterthesis.d4pm.training:build_model
  kwargs:
    epoch_samples: 512
    num_steps: 200
    beta_start: 0.0001
    beta_end: 0.02
    feats: 64
    d_model: 128
    d_ff: 512
    n_heads: 2
    n_layers: 2
    embed_dim: 128
  loss_factory: facet.models.masterthesis.d4pm.training:build_loss
  loss_kwargs:
    kind: l1
  device: cuda
  optimizer_factory: null
  optimizer_kwargs: {}
  scheduler_factory: null
  scheduler_kwargs: {}
data:
  context_factory: null
  dataset_factory: facet.models.masterthesis.d4pm.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    demean_input: true
    demean_target: true
  eeg_only: true
training:
  model_name: D4PMArtifactDiffusionNiazyProofFit
  chunk_size: 512
  val_ratio: 0.2
  trigger_aligned: true
  overlap: 0.0
  target_type: artifact
  max_epochs: 30
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  run_name: null
  output_dir: training_output
  checkpoint:
    dirpath: checkpoints
    monitor: loss
    mode: min
    save_top_k: 2
    save_last: true
    filename_template: epoch{epoch:04d}_{monitor}{value:.4f}
  early_stopping:
    monitor: loss
    mode: min
    patience: 10
    min_delta: 1.0e-06
  augmentation:
    enabled: false
    trigger_jitter_samples: 0
    noise_scale_range:
    - 1.0
    - 1.0
    channel_dropout_prob: 0.0
    sign_flip_prob: 0.0
  logging:
    log_every_n_steps: 10
    val_every_n_epochs: 1
    rich_live: true
    log_file: training.jsonl
    loss_plot_file: loss.png
    progress_bar: true
  extra: {}
export:
  enabled: true
  format: torchscript
  path: exports/d4pm.ts
  example_input_shape:
  - 1
  - 2
  - 512
  write_inference_config: false
  inference_config_path: null
inference: null

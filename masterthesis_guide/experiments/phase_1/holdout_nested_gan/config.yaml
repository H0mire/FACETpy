model:
  framework: pytorch
  factory: facet.models.masterthesis.nested_gan.training:build_model
  kwargs:
    inner_channels: 48
    inner_blocks: 4
    inner_heads: 4
    inner_expansion: 2.0
    outer_base_channels: 32
    n_fft: 64
    hop_length: 16
    win_length: 64
  loss_factory: facet.models.masterthesis.nested_gan.training:build_loss
  loss_kwargs:
    lambda_time: 1.0
    lambda_mrstft: 0.5
    fft_sizes:
    - 32
    - 64
    - 128
    - 256
    hop_fraction: 0.25
  device: cuda
  optimizer_factory: null
  optimizer_kwargs: {}
  scheduler_factory: null
  scheduler_kwargs: {}
data:
  context_factory: null
  dataset_factory: facet.models.masterthesis.nested_gan.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    context_epochs: 7
    demean_input: true
    demean_target: true
  eeg_only: true
training:
  model_name: NestedGANNiazyProofFit
  chunk_size: 512
  val_ratio: 0.2
  trigger_aligned: true
  overlap: 0.0
  target_type: artifact
  max_epochs: 80
  batch_size: 64
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  run_name: null
  output_dir: training_output
  checkpoint:
    dirpath: checkpoints
    monitor: loss
    mode: min
    save_top_k: 2
    save_last: true
    filename_template: epoch{epoch:04d}_{monitor}{value:.4f}
  early_stopping:
    monitor: loss
    mode: min
    patience: 15
    min_delta: 1.0e-06
  augmentation:
    enabled: false
    trigger_jitter_samples: 0
    noise_scale_range:
    - 1.0
    - 1.0
    channel_dropout_prob: 0.0
    sign_flip_prob: 0.0
  logging:
    log_every_n_steps: 10
    val_every_n_epochs: 1
    rich_live: true
    log_file: training.jsonl
    loss_plot_file: loss.png
    progress_bar: true
  extra: {}
export:
  enabled: true
  format: torchscript
  path: exports/nested_gan.ts
  example_input_shape: null
  write_inference_config: false
  inference_config_path: null
inference: null

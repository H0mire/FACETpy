model:
  framework: pytorch
  factory: facet.models.masterthesis.nested_gan.deployment.training:build_model
  kwargs:
    inner_channels: 72
    inner_blocks: 4
    inner_heads: 4
    inner_expansion: 2.0
    outer_base_channels: 32
    n_fft: 64
    hop_length: 16
    win_length: 64
  loss_factory: facet.models.masterthesis.nested_gan.deployment.training:build_loss
  loss_kwargs:
    name: recovered_clean
    amplitude_weight: 1.0
    velocity_weight: 0.00017043934156734243
    acceleration_weight: 1.3597193525429164e-05
    frequency_weight: 17.220293178786243
    si_sdr_weight: 0.0
    si_sdr_max: 30.0
    freq_band:
    - 1.0
    - 70.0
  wrapper_factory: null
  wrapper_kwargs: {}
  device: cuda
  optimizer_factory: null
  optimizer_kwargs: {}
  scheduler_factory: null
  scheduler_kwargs: {}
data:
  context_factory: null
  dataset_factory: facet.training.deployment_data:build_weg_a_packed_dataset
  kwargs:
    path: ./output/weg_a_farm_v10_locked_1ch/weg_a_spatiotemporal_dataset.npz
    packing: bt1s
  eeg_only: true
training:
  model_name: grid_nested_gan_lr0.00015_ch72_sisdr0_s42
  chunk_size: 512
  val_ratio: 0.2
  trigger_aligned: true
  overlap: 0.0
  target_type: artifact
  max_epochs: 80
  batch_size: 64
  learning_rate: 0.00015
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  run_name: null
  output_dir: grids/wega/nested_gan/lr0.00015_ch72_sisdr0_s42
  checkpoint:
    dirpath: checkpoints
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_last: false
    filename_template: epoch{epoch:04d}_{monitor}{value:.4f}
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20
    min_delta: 0.0
    min_delta_rel: 0.001
  augmentation:
    enabled: false
    trigger_jitter_samples: 0
    noise_scale_range:
    - 1.0
    - 1.0
    channel_dropout_prob: 0.0
    sign_flip_prob: 0.0
  logging:
    log_every_n_steps: 10
    val_every_n_epochs: 1
    rich_live: true
    log_file: training.jsonl
    loss_plot_file: loss.png
    progress_bar: true
  prediction_samples:
    enabled: false
    n_samples: 4
    every_n_epochs: 5
    seed: 7
    output_subdir: predictions
  extra: {}
export:
  enabled: false
  format: torchscript
  path: exports/nested_gan_wega.ts
  example_input_shape: null
  write_inference_config: false
  inference_config_path: null
inference: null

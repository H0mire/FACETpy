# DenoiseMamba deployment edition -- seed 44.
# 35 epochs at 3.36 min each with the parallel scan: ~2 h per seed.

checkpoint:
  mode: min
  monitor: val_loss
  save_last: true
  save_top_k: 2
data:
  dataset_factory: facet.models.denoise_mamba_deployment_edition.training:build_dataset
  eeg_only: true
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
early_stopping:
  min_delta: 0.0
  min_delta_rel: 0.001
  mode: min
  monitor: val_loss
  patience: 15
export:
  enabled: true
  format: torchscript
  path: exports/denoise_mamba_deployment_seed44.ts
  write_inference_config: false
logging:
  log_file: training.jsonl
  loss_plot_file: loss.png
  progress_bar: true
  rich_live: true
  val_every_n_epochs: 1
model:
  device: cuda
  factory: facet.models.denoise_mamba_deployment_edition.training:build_model
  framework: pytorch
  kwargs:
    checkpoint_scan: true
    d_conv: 4
    d_model: 64
    d_state: 16
    dropout: 0.1
    expand: 2
    input_kernel_size: 7
    n_blocks: 4
    parallel_scan: true
  loss_factory: facet.models.denoise_mamba_deployment_edition.training:build_loss
  loss_kwargs:
    acceleration_weight: 1.0
    amplitude_weight: 1.0
    freq_band:
    - 1.0
    - 70.0
    frequency_weight: 0.046
    name: recovered_clean
    si_sdr_max: 30.0
    si_sdr_weight: 1.0
    velocity_weight: 1.0
training:
  batch_size: 64
  chunk_size: 512
  grad_clip_norm: 1.0
  learning_rate: 0.001
  max_epochs: 35
  model_name: DenoiseMambaDeploymentNiazyProofFitSeed44
  output_dir: training_output
  seed: 44
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  weight_decay: 0.0001

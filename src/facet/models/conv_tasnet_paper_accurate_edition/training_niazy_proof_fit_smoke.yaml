# Smoke training of the PAPER-ACCURATE Conv-TasNet edition on the Niazy-only
# proof-fit dataset.
#
# ILLUSTRATIVE ONLY -- this file is NOT executed by the pytest smoke test. It
# documents how facet-train would wire up a tiny single-epoch CPU run. Every
# architecture dimension is shrunk so a forward+backward pass is trivial.
#
# Build dataset first:
#
#   uv run python examples/dataset_building/build_niazy_proof_fit_context_dataset.py \
#     --artifact-bundle output/artifact_libraries/niazy_aas_2x_direct/niazy_aas_direct_artifact.npz \
#     --target-epoch-samples 512 \
#     --context-epochs 7 \
#     --output-dir output/niazy_proof_fit_context_512
#
# Training:
#
#   uv run facet-train fit --config \
#     src/facet/models/conv_tasnet_paper_accurate_edition/training_niazy_proof_fit_smoke.yaml

model:
  framework: pytorch
  factory: facet.models.conv_tasnet_paper_accurate_edition.training:build_model
  kwargs:
    n_sources: 2
    encoder_filters: 16
    encoder_kernel: 16
    encoder_activation: linear   # paper's BEST config (Table III): linear encoder + sigmoid mask
    bottleneck_channels: 8
    hidden_channels: 16
    skip_channels: 8             # explicit Sc, distinct from bottleneck B (paper Fig. 1C / Table I)
    block_kernel: 3
    n_blocks: 3
    n_repeats: 1
    mask_activation: sigmoid
  loss_factory: facet.models.conv_tasnet_paper_accurate_edition.training:build_loss
  loss_kwargs:
    name: mse                    # ordered sources -> MSE, not SI-SNR/uPIT (see README)
  device: cpu

data:
  dataset_factory: facet.models.conv_tasnet_paper_accurate_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    demean_input: true
    demean_target: true
    max_examples: 64
  eeg_only: true

training:
  model_name: ConvTasNetPaperAccurateNiazySmoke
  chunk_size: 128
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 1
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.00001
  grad_clip_norm: 5.0
  seed: 42
  output_dir: training_output

checkpoint:
  monitor: loss
  mode: min
  save_top_k: 1
  save_last: true

early_stopping:
  monitor: loss
  mode: min
  patience: 5
  min_delta: 0.000001

logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true

export:
  enabled: true
  format: torchscript
  path: exports/conv_tasnet_paper_accurate.ts
  example_input_shape: [1, 1, 128]
  write_inference_config: false

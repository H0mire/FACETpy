# PAPER-ACCURATE NestedGAN edition -- CUDA fleet SMOKE (1 epoch, max_examples capped).
# Same paper-scale architecture as the full config; verifies worktree sync, dataset
# build, CUDA uv-run, checkpoint/loss.png/TorchScript export before the long run.
# See docs/research/run_4_paper_accurate_editions_fleet.md.

model:
  framework: pytorch
  factory: facet.models.nested_gan_paper_accurate_edition.training:build_model
  kwargs:
    inner_channels: 48
    inner_levels: 3
    inner_refinement_blocks: 2
    inner_expansion: 2.66
    inner_bias_free_norm: false
    inner_neighbor_epochs: 0
    outer_base_channels: 32
    n_fft: 64
    hop_length: 16
    win_length: 64
  loss_factory: facet.models.nested_gan_paper_accurate_edition.training:build_loss
  loss_kwargs:
    lambda_time: 1.0
    lambda_mrstft: 0.5
    fft_sizes:
    - 32
    - 64
    - 128
    - 256
    hop_fraction: 0.25
  device: cuda
data:
  dataset_factory: facet.models.nested_gan_paper_accurate_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    context_epochs: 7
    demean_input: true
    demean_target: true
    max_examples: 256
  eeg_only: true
training:
  model_name: NestedGANPaperAccurateCudaSmoke
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 1
  batch_size: 64
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
checkpoint:
  monitor: loss
  mode: min
  save_top_k: 1
  save_last: true
early_stopping:
  monitor: loss
  mode: min
  patience: 5
  min_delta: 1.0e-06
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/nested_gan_paper_accurate_cuda_smoke.ts
  write_inference_config: false

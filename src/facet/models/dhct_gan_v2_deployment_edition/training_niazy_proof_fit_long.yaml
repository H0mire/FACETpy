# dhct_gan_v2 deployment edition -- long-budget run.
#
# Identical to training_niazy_proof_fit.yaml except for the epoch ceiling
# and patience. It exists because the first pass was budget-limited:
# ic_unet's best epoch was 120 of 120, still improving when the run ended.
# A run that max_epochs stopped says nothing about convergence, so the
# ceiling is raised until early stopping is what ends it.
#
# 24,990 examples per epoch -> ceiling 400, patience 25.

model:
  framework: pytorch
  factory: facet.models.dhct_gan_v2_deployment_edition.training:build_model
  kwargs:
    context_epochs: 7
    base_channels: 16
    depth: 4
    num_heads: 4
    window_size: 16
  loss_factory: facet.models.dhct_gan_v2_deployment_edition.training:build_loss
  loss_kwargs:
    name: recovered_clean
    amplitude_weight: 1.0
    velocity_weight: 1.0
    acceleration_weight: 1.0
    frequency_weight: 0.046
    si_sdr_weight: 1.0
    si_sdr_max: 30.0
    freq_band:
    - 1.0
    - 70.0
  device: cuda
data:
  dataset_factory: facet.models.dhct_gan_v2_deployment_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
  eeg_only: true
training:
  model_name: DhctGanV2DeploymentNiazyProofFitLong
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 400
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 2
  save_last: true
early_stopping:
  monitor: val_loss
  mode: min
  patience: 25
  min_delta: 0.0
  min_delta_rel: 0.001
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/dhct_gan_v2_deployment_long.ts
  write_inference_config: false

# DHCT-GAN strict edition -- EXTENDED configuration (multi-channel), full GPU training.
#
# Paper: Cai et al., MDPI Sensors 25(1):231, 2025 (doi:10.3390/s25010231).
# Paper-scale encoder (64...1024), all three discriminators trained through
# facet.training.adversarial.AdversarialModelWrapper.
#
# WHAT THIS MEASURES: the FACETpy multi-channel context *extension*, NOT a paper
# replication. DHCT-GAN is single-channel (Sec. 2.1), and its own limitations
# section names exactly the gap this config fills: all signals were segmented into
# one-dimensional segments "without considering correction amongst channels".
# Every number from this run belongs to the extension.
#
# Counterpart: training_weg_a_paper.yaml (target electrode only).
# See documentation/paper_accuracy_review.md Sec. 2.1.
#
# Run:
#   uv run facet-train fit --config src/facet/models/dhct_gan_strict_edition/training_weg_a_extended.yaml

model:
  framework: pytorch
  factory: facet.models.dhct_gan_strict_edition.training:build_model
  kwargs:
    encoder_dims: [64, 128, 256, 512, 1024]   # paper Sec. 2.2.2
    n_heads: 4
    lsa_blocks: 8                             # paper: LSA splits into 8 blocks
    decoder_head: auto                        # paper FC head while affordable
    cross_channel_attention: true             # FACETpy extension
  loss_factory: facet.models.dhct_gan_strict_edition.training:build_loss
  loss_kwargs:
    lambda_feat: 1.0                          # paper names lambda1/lambda2 but no values
    lambda_adv: 0.1
    discriminator_dims: [64, 64, 128, 128, 256, 256, 512, 512]   # paper Fig. 2a, M = 8
    # Let the reconstruction term find its scale before a still-random
    # discriminator starts pushing. On a 40 dB dynamic range that push is enough
    # to derail the branch losses in the first few hundred steps.
    adversarial_warmup_steps: 500
  wrapper_factory: facet.models.dhct_gan_strict_edition.training:build_wrapper
  wrapper_kwargs:
    discriminator_learning_rate: 0.0001
    generator_betas: [0.5, 0.9]               # paper Sec. 2.2.4
    discriminator_betas: [0.9, 0.999]         # paper Sec. 2.2.4
    n_discriminator_steps: 1
    # Gradient accumulation, not a smaller recipe. The LGTB's global attention
    # spans the full 1792-token window in the first encoding block and every
    # electrode is its own sequence, so seven electrodes cost roughly seven times
    # the memory of one. Accumulating over micro-batches keeps the optimizer's
    # batch at the configured batch_size while the GPU only ever holds
    # micro_batch_size examples. Losses are weighted chunk/batch, so the update is
    # the full-batch update exactly (tested).
    # Measured on an RTX 5090 (32.6 GB), batch 40, sweeping this value:
    #   4 -> 7.1 GB, 13.0 min/epoch | 8 -> 12.6 GB, 11.8 | 16 -> 23.7 GB, 11.2 | 32 -> OOM
    # The model is compute-bound, so larger micro-batches buy little: 8 takes the
    # cheap 9 % and keeps 20 GB of headroom.
    micro_batch_size: 8
  device: cuda
data:
  dataset_factory: facet.models.dhct_gan_strict_edition.training:build_dataset
  kwargs:
    path: ./output/weg_a_farm_v7_k6_512/weg_a_spatiotemporal_dataset.npz
    # no max_channels: target electrode + its 6 geodesic neighbours
  eeg_only: true
training:
  model_name: DHCTGanStrictWegAExtended
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  # The builder stores its own leakage-free split with a guard band;
  # train_val_split honours it and ignores this ratio (see dataset.py).
  val_ratio: 0.2
  max_epochs: 120
  batch_size: 40         # paper Sec. 2.2.4, reached via accumulation
  learning_rate: 0.0001         # paper Sec. 2.2.4 ("fixed at 0.0001")
  weight_decay: 0.0             # paper uses plain Adam
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 3
  save_last: true
early_stopping:
  monitor: val_loss
  mode: min
  patience: 20
  # 0.0 on purpose. A min_delta larger than the loss' own scale silently turns
  # early stopping into "stop after `patience` epochs" -- that happened in run 6.
  min_delta: 0.0
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/dhct_gan_strict_weg_a_extended.ts
  write_inference_config: false

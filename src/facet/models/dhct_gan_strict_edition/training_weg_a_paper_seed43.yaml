# DHCT-GAN strict edition -- PAPER configuration, full GPU training.
#
# Paper: Cai et al., MDPI Sensors 25(1):231, 2025 (doi:10.3390/s25010231).
# Paper-scale encoder (64...1024), all three discriminators trained through
# facet.training.adversarial.AdversarialModelWrapper.
#
# WHAT THIS MEASURES: the paper configuration. DHCT-GAN consumes a single-channel
# 1-D segment (Sec. 2.1: 2 s at 512 Hz = 1024 samples). max_channels: 1 keeps the
# target electrode alone, and the seven epochs are concatenated in time into one
# 3584-sample 1-D waveform -- so the only deviation from the paper's input is the
# window length. The multi-epoch window is also what keeps this out of the
# one-epoch-and-one-channel case, which carries no comparison at all.
#
# Counterpart: training_weg_a_extended.yaml (adds neighbouring electrodes).
# Comparing the two is the ablation that says what spatial context is worth here;
# neither number may be reported as the other's.
#
# Run:
#   uv run facet-train fit --config src/facet/models/dhct_gan_strict_edition/training_weg_a_paper.yaml

model:
  framework: pytorch
  factory: facet.models.dhct_gan_strict_edition.training:build_model
  kwargs:
    encoder_dims: [64, 128, 256, 512, 1024]   # paper Sec. 2.2.2
    n_heads: 4
    lsa_blocks: 8                             # paper: LSA splits into 8 blocks
    decoder_head: auto                        # paper FC head while affordable
    cross_channel_attention: false            # single channel: nothing to bridge
  loss_factory: facet.models.dhct_gan_strict_edition.training:build_loss
  loss_kwargs:
    lambda_feat: 1.0                          # paper names lambda1/lambda2 but no values
    lambda_adv: 0.1
    discriminator_dims: [64, 64, 128, 128, 256, 256, 512, 512]   # paper Fig. 2a, M = 8
    # Let the reconstruction term find its scale before a still-random
    # discriminator starts pushing. On a 40 dB dynamic range that push is enough
    # to derail the branch losses in the first few hundred steps.
    adversarial_warmup_steps: 500
  wrapper_factory: facet.models.dhct_gan_strict_edition.training:build_wrapper
  wrapper_kwargs:
    discriminator_learning_rate: 0.0001
    generator_betas: [0.5, 0.9]               # paper Sec. 2.2.4
    discriminator_betas: [0.9, 0.999]         # paper Sec. 2.2.4
    n_discriminator_steps: 1
    # No accumulation needed. Measured on an RTX 5090 (32.6 GB): batch 32 -> 8.9 GB,
    # batch 64 -> 15.1 GB at 202 examples/s, ~1.6 min per epoch. The paper's batch
    # of 40 therefore fits directly, so this run uses it unrounded.
    # (MPS reported 24.6 GB for batch 32 -- it materialises the attention matrix
    # where CUDA picks a memory-efficient kernel. Always measure on the target.)
    micro_batch_size: null
  device: cuda
data:
  dataset_factory: facet.models.dhct_gan_strict_edition.training:build_dataset
  kwargs:
    # The 1-electrode export of weg_a_farm_v7_k6_512: byte-identical to the full
    # dataset restricted to the target channel (verified), same split, 0.91 GB
    # instead of 8.06 GB. Written by tools/dataset_building/export_channel_subset.py;
    # point this at the k6 dataset instead if you want to change max_channels.
    path: ./output/weg_a_farm_v7_k1_512/weg_a_spatiotemporal_dataset.npz
    max_channels: 1          # paper configuration: target electrode only
  eeg_only: true
training:
  model_name: DHCTGanStrictWegAPaperSeed43
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  # The builder stores its own leakage-free split with a guard band;
  # train_val_split honours it and ignores this ratio (see dataset.py).
  val_ratio: 0.2
  max_epochs: 120
  batch_size: 40         # paper Sec. 2.2.4, exactly
  learning_rate: 0.0001         # paper Sec. 2.2.4 ("fixed at 0.0001")
  weight_decay: 0.0             # paper uses plain Adam
  grad_clip_norm: 1.0
  seed: 43
  output_dir: training_output
checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 3
  save_last: true
early_stopping:
  monitor: val_loss
  mode: min
  patience: 20
  # 0.0 on purpose. A min_delta larger than the loss' own scale silently turns
  # early stopping into "stop after `patience` epochs" -- that happened in run 6.
  min_delta: 0.0
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/dhct_gan_strict_weg_a_paper_seed43.ts
  write_inference_config: false

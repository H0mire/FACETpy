# DHCT-GAN strict edition -- CPU smoke run.
#
# Deliberately tiny (3 encoder stages instead of the paper's 5, 200 examples, 2
# epochs) so it finishes on a laptop. It is a plumbing check, not a result: it
# proves the three discriminators are built, updated and checkpointed and that the
# TorchScript export of the three-output generator succeeds. Use
# training_weg_a_paper.yaml (or _extended.yaml) for anything you intend to report.
#
# Run:
#   uv run facet-train fit --config src/facet/models/dhct_gan_strict_edition/training_weg_a_smoke.yaml

model:
  framework: pytorch
  factory: facet.models.dhct_gan_strict_edition.training:build_model
  kwargs:
    encoder_dims: [16, 32, 64]
    n_heads: 4
    lsa_blocks: 8
    decoder_head: conv
    cross_channel_attention: true
  loss_factory: facet.models.dhct_gan_strict_edition.training:build_loss
  loss_kwargs:
    lambda_feat: 1.0
    lambda_adv: 0.1
    discriminator_dims: [16, 32, 64]
    adversarial_warmup_steps: 0
  wrapper_factory: facet.models.dhct_gan_strict_edition.training:build_wrapper
  wrapper_kwargs:
    discriminator_learning_rate: 0.0001
    generator_betas: [0.5, 0.9]
    discriminator_betas: [0.9, 0.999]
    n_discriminator_steps: 1
  device: cpu
data:
  dataset_factory: facet.models.dhct_gan_strict_edition.training:build_dataset
  kwargs:
    path: ./output/weg_a_farm_v7_k6_512/weg_a_spatiotemporal_dataset.npz
    max_examples: 200
    max_channels: 3          # plumbing check, not a memory test
  eeg_only: true
training:
  model_name: DHCTGanStrictWegASmoke
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 2
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
checkpoint:
  monitor: loss
  mode: min
  save_top_k: 1
  save_last: true
logging:
  rich_live: false
  log_file: training.jsonl
  loss_plot_file: null
  val_every_n_epochs: 1
  progress_bar: false
export:
  enabled: true
  format: torchscript
  path: exports/dhct_gan_strict_smoke.ts
  write_inference_config: false

<rect x="220" y="1170" width="560" height="170" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M220 1182 A12 12 0 0 1 232 1170 L768 1170 A12 12 0 0 1 780 1182 L780 1217 L220 1217 Z" fill="url(#fp-header)"/><circle cx="241" cy="1194" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="260" y="1199" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Asymmetric MAE decoder</text><text x="238" y="1245" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Reinsert mask tokens; separate lightweight Transformer</text><text x="238" y="1269" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">decoder.</text><text x="238" y="1293" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">In training return masked-patch predictions for the</text><text x="238" y="1317" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">reconstruction loss.</text>

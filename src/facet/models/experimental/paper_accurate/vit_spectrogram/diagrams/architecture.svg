<rect x="220" y="622" width="560" height="122" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M220 634 A12 12 0 0 1 232 622 L768 622 A12 12 0 0 1 780 634 L780 669 L220 669 Z" fill="url(#fp-header)"/><circle cx="241" cy="646" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="260" y="651" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Magnitude patches</text><text x="238" y="697" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">log(1 + magnitude), non-overlapping patches and token</text><text x="238" y="721" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">projection.</text>

<rect x="220" y="1766" width="560" height="122" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M220 1778 A12 12 0 0 1 232 1766 L768 1766 A12 12 0 0 1 780 1778 L780 1813 L220 1813 Z" fill="url(#fp-header)"/><circle cx="241" cy="1790" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="260" y="1795" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Inverse STFT and centre</text><text x="238" y="1841" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Restore spectral padding; inverse STFT; select the centre</text><text x="238" y="1865" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">waveform.</text>

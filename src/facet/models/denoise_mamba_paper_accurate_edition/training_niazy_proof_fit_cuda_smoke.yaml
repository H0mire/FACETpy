# PAPER-ACCURATE DenoiseMamba edition -- CUDA fleet SMOKE (1 epoch, max_examples capped).
# Same paper-scale architecture as the full config; verifies worktree sync, dataset
# build, CUDA uv-run, checkpoint/loss.png/TorchScript export before the long run.
# See docs/research/run_4_paper_accurate_editions_fleet.md.

model:
  framework: pytorch
  factory: facet.models.denoise_mamba_paper_accurate_edition.training:build_model
  kwargs:
    base_channels: 64
    n_stages: 3
    d_state: 16
    n_heads: 1
    d_conv: 4
    dropout: 0.2
    ssd_chunk_size: 64
  loss_factory: facet.models.denoise_mamba_paper_accurate_edition.training:build_loss
  loss_kwargs:
    name: mse
  device: cuda
data:
  dataset_factory: facet.models.denoise_mamba_paper_accurate_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    target_type: clean
    normalize: zscore
    max_examples: 256
  eeg_only: true
training:
  model_name: DenoiseMambaPaperAccurateCudaSmoke
  chunk_size: 512
  target_type: clean
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 1
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
checkpoint:
  monitor: loss
  mode: min
  save_top_k: 1
  save_last: true
early_stopping:
  monitor: loss
  mode: min
  patience: 5
  min_delta: 1.0e-06
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/denoise_mamba_paper_accurate_cuda_smoke.ts
  write_inference_config: false

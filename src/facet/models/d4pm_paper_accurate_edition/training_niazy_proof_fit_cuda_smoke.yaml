# PAPER-ACCURATE D4PM edition -- CUDA fleet SMOKE (1 epoch, max_examples capped).
# Same paper-scale architecture as the full config; verifies worktree sync, dataset
# build, CUDA uv-run, checkpoint/loss.png/TorchScript export before the long run.
# See docs/research/run_4_paper_accurate_editions_fleet.md.

model:
  framework: pytorch
  factory: facet.models.d4pm_paper_accurate_edition.training:build_model
  kwargs:
    epoch_samples: 512
    num_steps: 200
    beta_start: 0.0001
    beta_end: 0.02
    feats: 64
    d_model: 128
    d_ff: 512
    n_heads: 2
    n_layers: 3
    embed_dim: 128
    num_classes: 1
    norm_first: false
    dual_branch: true
    lambda_snr: 1.0
  loss_factory: facet.models.d4pm_paper_accurate_edition.training:build_loss
  loss_kwargs:
    name: l1
  device: cuda
data:
  dataset_factory: facet.models.d4pm_paper_accurate_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    dual_branch: true
    demean_input: true
    demean_target: true
    max_examples: 256
  eeg_only: true
training:
  model_name: D4PMPaperAccurateCudaSmoke
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 1
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
checkpoint:
  monitor: loss
  mode: min
  save_top_k: 1
  save_last: true
early_stopping:
  monitor: loss
  mode: min
  patience: 5
  min_delta: 1.0e-06
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/d4pm_paper_accurate_cuda_smoke.ts
  write_inference_config: false

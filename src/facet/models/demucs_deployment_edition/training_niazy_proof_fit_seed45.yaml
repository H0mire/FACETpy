# demucs deployment edition -- seed 45, third replicate.
# Three seeds is the minimum at which a difference between two
# architectures can be told apart from the spread within one.

model:
  framework: pytorch
  factory: facet.models.demucs_deployment_edition.training:build_model
  kwargs:
    depth: 4
    initial_channels: 64
    kernel_size: 8
    stride: 4
    lstm_layers: 2
    in_channels: 1
    out_channels: 1
    n_sources: 1
    rescale: 0.1
  loss_factory: facet.models.demucs_deployment_edition.training:build_loss
  loss_kwargs:
    name: recovered_clean
    amplitude_weight: 1.0
    velocity_weight: 1.0
    acceleration_weight: 1.0
    frequency_weight: 0.046
    si_sdr_weight: 1.0
    si_sdr_max: 30.0
    freq_band:
    - 1.0
    - 70.0
  device: cuda
data:
  dataset_factory: facet.models.demucs_deployment_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
  eeg_only: true
training:
  model_name: DemucsDeploymentNiazyProofFitSeed45
  chunk_size: 3584
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 60
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0
  grad_clip_norm: 5.0
  seed: 45
  output_dir: training_output
checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 2
  save_last: true
early_stopping:
  monitor: val_loss
  mode: min
  patience: 20
  min_delta: 0.0
  min_delta_rel: 0.001
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/demucs_deployment_seed45.ts
  write_inference_config: false

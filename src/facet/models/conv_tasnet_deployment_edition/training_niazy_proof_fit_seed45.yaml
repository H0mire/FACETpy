# conv_tasnet deployment edition -- seed 45, third replicate.
# Three seeds is the minimum at which a difference between two
# architectures can be told apart from the spread within one.

model:
  framework: pytorch
  factory: facet.models.conv_tasnet_deployment_edition.training:build_model
  kwargs:
    n_sources: 2
    encoder_filters: 256
    encoder_kernel: 16
    bottleneck_channels: 128
    hidden_channels: 256
    block_kernel: 3
    n_blocks: 8
    n_repeats: 2
    mask_activation: sigmoid
  loss_factory: facet.models.conv_tasnet_deployment_edition.training:build_loss
  loss_kwargs:
    name: recovered_clean
    amplitude_weight: 1.0
    velocity_weight: 1.0
    acceleration_weight: 1.0
    frequency_weight: 0.046
    si_sdr_weight: 1.0
    si_sdr_max: 30.0
    freq_band:
    - 1.0
    - 70.0
  device: cuda
data:
  dataset_factory: facet.models.conv_tasnet_deployment_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
  eeg_only: true
training:
  model_name: ConvTasnetDeploymentNiazyProofFitSeed45
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 80
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  seed: 45
  output_dir: training_output
checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 2
  save_last: true
early_stopping:
  monitor: val_loss
  mode: min
  patience: 20
  min_delta: 0.0
  min_delta_rel: 0.001
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/conv_tasnet_deployment_seed45.ts
  example_input_shape:
  - 1
  - 1
  - 512
  write_inference_config: false

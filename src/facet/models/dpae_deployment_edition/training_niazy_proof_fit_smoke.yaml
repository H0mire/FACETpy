# CPU smoke config for dpae_deployment_edition. Two epochs, 32 examples, no export.

checkpoint:
  mode: min
  monitor: val_loss
  save_last: true
  save_top_k: 2
data:
  dataset_factory: facet.models.dpae_deployment_edition.training:build_dataset
  eeg_only: true
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    max_examples: 32
early_stopping:
  min_delta: 0.0
  min_delta_rel: 0.001
  mode: min
  monitor: val_loss
  patience: 2
export:
  enabled: false
  format: torchscript
  path: exports/dpae_deployment.ts
  write_inference_config: false
logging:
  log_file: training.jsonl
  loss_plot_file: loss.png
  progress_bar: true
  rich_live: false
  val_every_n_epochs: 1
model:
  device: cpu
  factory: facet.models.dpae_deployment_edition.training:build_model
  framework: pytorch
  kwargs:
    base_filters: 32
    latent_filters: 128
    residual_init: 0.0
  loss_factory: facet.models.dpae_deployment_edition.training:build_loss
  loss_kwargs:
    acceleration_weight: 1.0
    amplitude_weight: 1.0
    freq_band:
    - 1.0
    - 70.0
    frequency_weight: 0.046
    name: recovered_clean
    si_sdr_max: 30.0
    si_sdr_weight: 1.0
    velocity_weight: 1.0
training:
  batch_size: 4
  chunk_size: 512
  grad_clip_norm: 1.0
  learning_rate: 0.001
  max_epochs: 2
  model_name: DpaeDeploymentNiazySmoke
  output_dir: training_output
  seed: 42
  target_type: artifact
  trigger_aligned: false
  val_ratio: 0.2
  weight_decay: 0.0001

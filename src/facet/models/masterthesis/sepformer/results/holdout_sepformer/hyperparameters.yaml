experiment: holdout_sepformer
model: sepformer
phase: 1
dataset: proof_fit
training_dataset: proof_fit
protocol: unified_holdout
status: original_resolved
source:
  path: masterthesis_guide/experiments/phase_1/holdout_sepformer/provenance/facet_train_config.resolved.json
  sha256: f0b877b239c2299495e4a91efb5dec3fc3b38f40db4621b585796251de0039a6
reproduction_config: masterthesis_guide/experiments/phase_1/holdout_sepformer/config.yaml
configuration_provenance: null
parameters:
  model:
    framework: pytorch
    factory: facet.models.sepformer.training:build_model
    kwargs:
      epoch_samples: 512
      context_epochs: 7
      encoder_channels: 128
      encoder_kernel: 16
      encoder_stride: 8
      chunk_size: 64
      n_blocks: 2
      intra_layers: 4
      inter_layers: 4
      intra_heads: 4
      inter_heads: 4
      d_ffn: 256
      dropout: 0.1
      skip_around_intra: true
      mask_activation: relu
    loss_factory: facet.models.sepformer.training:build_loss
    loss_kwargs:
      name: mse
    device: cuda
    optimizer_factory: null
    optimizer_kwargs: {}
    scheduler_factory: null
    scheduler_kwargs: {}
  data:
    context_factory: null
    dataset_factory: facet.models.sepformer.training:build_dataset
    kwargs:
      path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
      context_epochs: 7
      demean_input: true
      demean_target: true
    eeg_only: true
  training:
    model_name: SepFormerNiazyProofFit
    chunk_size: 512
    val_ratio: 0.2
    trigger_aligned: true
    overlap: 0.0
    target_type: artifact
    max_epochs: 50
    batch_size: 64
    learning_rate: 0.0005
    weight_decay: 0.0001
    grad_clip_norm: 1.0
    seed: 42
    run_name: null
    output_dir: training_output
    checkpoint:
      dirpath: checkpoints
      monitor: loss
      mode: min
      save_top_k: 2
      save_last: true
      filename_template: epoch{epoch:04d}_{monitor}{value:.4f}
    early_stopping:
      monitor: loss
      mode: min
      patience: 10
      min_delta: 1.0e-06
    augmentation:
      enabled: false
      trigger_jitter_samples: 0
      noise_scale_range:
      - 1.0
      - 1.0
      channel_dropout_prob: 0.0
      sign_flip_prob: 0.0
    logging:
      log_every_n_steps: 10
      val_every_n_epochs: 1
      rich_live: true
      log_file: training.jsonl
      loss_plot_file: loss.png
      progress_bar: true
    extra: {}

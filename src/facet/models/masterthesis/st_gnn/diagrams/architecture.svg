<rect x="170" y="98" width="300" height="122" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M170 110 A12 12 0 0 1 182 98 L458 98 A12 12 0 0 1 470 110 L470 145 L170 145 Z" fill="url(#fp-header)"/><circle cx="191" cy="122" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="210" y="127" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Multichannel context</text><text x="188" y="173" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Rearrange to batch x features</text><text x="188" y="197" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">x electrodes x time.</text>

<rect x="220" y="842" width="560" height="122" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M220 854 A12 12 0 0 1 232 842 L768 842 A12 12 0 0 1 780 854 L780 889 L220 889 Z" fill="url(#fp-header)"/><circle cx="241" cy="866" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="260" y="871" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Centre-epoch artifact</text><text x="238" y="917" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Slice the centre epoch; output batch x electrodes x</text><text x="238" y="941" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">samples.</text>

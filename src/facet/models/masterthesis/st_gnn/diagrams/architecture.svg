<rect x="220" y="346" width="560" height="146" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M220 358 A12 12 0 0 1 232 346 L768 346 A12 12 0 0 1 780 358 L780 393 L220 393 Z" fill="url(#fp-header)"/><circle cx="241" cy="370" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="260" y="375" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Two spatiotemporal blocks</text><text x="238" y="421" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Temporal tanh/sigmoid gate -&gt; Chebyshev convolution -&gt;</text><text x="238" y="445" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">temporal gate.</text><text x="238" y="469" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Residual projection and GroupNorm complete each block.</text>

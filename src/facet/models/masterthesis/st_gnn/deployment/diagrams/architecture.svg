<rect x="220" y="98" width="560" height="170" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M220 110 A12 12 0 0 1 232 98 L768 98 A12 12 0 0 1 780 110 L780 145 L220 145 Z" fill="url(#fp-header)"/><circle cx="241" cy="122" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="260" y="127" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Deployment input normalisation</text><text x="238" y="173" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Demean across configured axes; optionally divide by input</text><text x="238" y="197" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">standard deviation.</text><text x="238" y="221" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Packing and context axis come from the run</text><text x="238" y="245" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">configuration.</text>
<rect x="170" y="394" width="300" height="122" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M170 406 A12 12 0 0 1 182 394 L458 394 A12 12 0 0 1 470 406 L470 441 L170 441 Z" fill="url(#fp-header)"/><circle cx="191" cy="418" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="210" y="423" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Multichannel context</text><text x="188" y="469" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Rearrange to batch x features</text><text x="188" y="493" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">x electrodes x time.</text>
<rect x="530" y="394" width="300" height="122" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M530 406 A12 12 0 0 1 542 394 L818 394 A12 12 0 0 1 830 406 L830 441 L530 441 Z" fill="url(#fp-header)"/><circle cx="551" cy="418" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="570" y="423" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Electrode graph</text><text x="548" y="469" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Montage-derived adjacency</text><text x="548" y="493" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">and scaled graph Laplacian.</text>
<rect x="220" y="642" width="560" height="146" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M220 654 A12 12 0 0 1 232 642 L768 642 A12 12 0 0 1 780 654 L780 689 L220 689 Z" fill="url(#fp-header)"/><circle cx="241" cy="666" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="260" y="671" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Two spatiotemporal blocks</text><text x="238" y="717" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Temporal tanh/sigmoid gate -&gt; Chebyshev convolution -&gt;</text><text x="238" y="741" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">temporal gate.</text><text x="238" y="765" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">Residual projection and GroupNorm complete each block.</text>
<rect x="220" y="914" width="560" height="98" rx="12" fill="#ffffff" stroke="#173147" stroke-opacity="0.16" stroke-width="1.25" filter="url(#fp-shadow)"/><path d="M220 926 A12 12 0 0 1 232 914 L768 914 A12 12 0 0 1 780 926 L780 961 L220 961 Z" fill="url(#fp-header)"/><circle cx="241" cy="938" r="4.5" fill="#aedbec" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/><text x="260" y="943" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="21" fill="#ffffff" font-weight="600">Output head</text><text x="238" y="989" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" fill="#173147">1x1 convolution predicts the artifact for every electrode.</text>

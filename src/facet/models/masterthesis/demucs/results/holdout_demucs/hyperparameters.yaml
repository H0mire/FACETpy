experiment: holdout_demucs
model: demucs
phase: 1
dataset: proof_fit
training_dataset: proof_fit
protocol: unified_holdout
status: original_resolved
source:
  path: masterthesis_guide/experiments/phase_1/holdout_demucs/provenance/facet_train_config.resolved.json
  sha256: 2e299981f704e75ab439b85cb448ad93f3a62ded7a273d898be8f25fcbbf7224
reproduction_config: masterthesis_guide/experiments/phase_1/holdout_demucs/config.yaml
configuration_provenance: null
parameters:
  model:
    framework: pytorch
    factory: facet.models.demucs.training:build_model
    kwargs:
      depth: 4
      initial_channels: 64
      kernel_size: 8
      stride: 4
      lstm_layers: 2
      in_channels: 1
      out_channels: 1
      n_sources: 1
      rescale: 0.1
    loss_factory: facet.models.demucs.training:build_loss
    loss_kwargs:
      name: l1
    device: cuda
    optimizer_factory: null
    optimizer_kwargs: {}
    scheduler_factory: null
    scheduler_kwargs: {}
  data:
    context_factory: null
    dataset_factory: facet.models.demucs.training:build_dataset
    kwargs:
      path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
      context_epochs: 7
      demean_input: true
      demean_target: true
    eeg_only: true
  training:
    model_name: DemucsNiazyProofFit
    chunk_size: 3584
    val_ratio: 0.2
    trigger_aligned: true
    overlap: 0.0
    target_type: artifact
    max_epochs: 60
    batch_size: 32
    learning_rate: 0.0003
    weight_decay: 0.0
    grad_clip_norm: 5.0
    seed: 42
    run_name: null
    output_dir: training_output
    checkpoint:
      dirpath: checkpoints
      monitor: loss
      mode: min
      save_top_k: 2
      save_last: true
      filename_template: epoch{epoch:04d}_{monitor}{value:.4f}
    early_stopping:
      monitor: loss
      mode: min
      patience: 12
      min_delta: 1.0e-06
    augmentation:
      enabled: false
      trigger_jitter_samples: 0
      noise_scale_range:
      - 1.0
      - 1.0
      channel_dropout_prob: 0.0
      sign_flip_prob: 0.0
    logging:
      log_every_n_steps: 10
      val_every_n_epochs: 1
      rich_live: true
      log_file: training.jsonl
      loss_plot_file: loss.png
      progress_bar: true
    extra: {}

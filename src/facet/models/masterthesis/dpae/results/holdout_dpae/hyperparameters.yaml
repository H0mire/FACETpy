experiment: holdout_dpae
model: dpae
phase: 1
dataset: proof_fit
training_dataset: proof_fit
protocol: unified_holdout
status: original_resolved
source:
  path: masterthesis_guide/experiments/phase_1/holdout_dpae/provenance/facet_train_config.resolved.json
  sha256: 7eaeac14ad7cdaa7818852a0aa5eee6c95a2d548c2a547b7a1dc8af956274ace
reproduction_config: masterthesis_guide/experiments/phase_1/holdout_dpae/config.yaml
configuration_provenance: null
parameters:
  model:
    framework: pytorch
    factory: facet.models.dpae.training:build_model
    kwargs:
      base_filters: 32
      latent_filters: 128
      residual_init: 0.0
    loss_factory: facet.models.dpae.training:build_loss
    loss_kwargs:
      name: mse
    device: cuda
    optimizer_factory: null
    optimizer_kwargs: {}
    scheduler_factory: null
    scheduler_kwargs: {}
  data:
    context_factory: null
    dataset_factory: facet.models.dpae.training:build_dataset
    kwargs:
      path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
      demean_input: true
      demean_target: true
    eeg_only: true
  training:
    model_name: DualPathwayAutoencoderNiazyProofFit
    chunk_size: 512
    val_ratio: 0.2
    trigger_aligned: false
    overlap: 0.0
    target_type: artifact
    max_epochs: 80
    batch_size: 128
    learning_rate: 0.001
    weight_decay: 0.0001
    grad_clip_norm: 1.0
    seed: 42
    run_name: null
    output_dir: training_output
    checkpoint:
      dirpath: checkpoints
      monitor: loss
      mode: min
      save_top_k: 2
      save_last: true
      filename_template: epoch{epoch:04d}_{monitor}{value:.4f}
    early_stopping:
      monitor: loss
      mode: min
      patience: 15
      min_delta: 1.0e-06
    augmentation:
      enabled: false
      trigger_jitter_samples: 0
      noise_scale_range:
      - 1.0
      - 1.0
      channel_dropout_prob: 0.0
      sign_flip_prob: 0.0
    logging:
      log_every_n_steps: 10
      val_every_n_epochs: 1
      rich_live: true
      log_file: training.jsonl
      loss_plot_file: loss.png
      progress_bar: true
    extra: {}

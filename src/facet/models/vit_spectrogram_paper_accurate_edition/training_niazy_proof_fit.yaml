# PAPER-ACCURATE ViTSpectrogram edition -- FULL CUDA training on the Niazy proof-fit dataset.
# Generated as the GPU-fleet counterpart of the CPU smoke config (see Run 4 plan:
# docs/research/run_4_paper_accurate_editions_fleet.md). Paper-scale dimensions, device: cuda.
#
# Build the dataset once per worker (fleet --prepare-command):
#   uv run python examples/dataset_building/build_niazy_proof_fit_context_dataset.py \
#     --artifact-bundle output/artifact_libraries/niazy_aas_2x_direct/niazy_aas_direct_artifact.npz \
#     --target-epoch-samples 512 --context-epochs 7 --output-dir output/niazy_proof_fit_context_512
#
# Train:
#   uv run facet-train fit --config src/facet/models/vit_spectrogram_paper_accurate_edition/training_niazy_proof_fit.yaml

model:
  framework: pytorch
  factory: facet.models.vit_spectrogram_paper_accurate_edition.training:build_model
  kwargs:
    n_fft: 64
    hop_length: 16
    freq_bins: 32
    time_frames: 224
    patch_freq: 4
    patch_time: 16
    embed_dim: 192
    depth: 6
    n_heads: 6
    mlp_ratio: 4.0
    dropout: 0.0
    decoder_embed_dim: 96
    decoder_depth: 2
    decoder_heads: 4
    decoder_mlp_ratio: 4.0
    mask_margin_patches: 1
  loss_factory: facet.models.vit_spectrogram_paper_accurate_edition.training:build_loss
  loss_kwargs:
    name: mse
    epoch_samples: 512
    context_epochs: 7
    n_fft: 64
    hop_length: 16
    freq_bins: 32
    time_frames: 224
    patch_freq: 4
    patch_time: 16
    mask_margin_patches: 1
    normalize_target: true
  device: cuda
data:
  dataset_factory: facet.models.vit_spectrogram_paper_accurate_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    context_epochs: 7
    demean_input: true
    demean_target: true
  eeg_only: true
training:
  model_name: ViTSpectrogramPaperAccurateNiazyProofFit
  chunk_size: 512
  target_type: clean
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 60
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.05
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
checkpoint:
  monitor: loss
  mode: min
  save_top_k: 2
  save_last: true
early_stopping:
  monitor: loss
  mode: min
  patience: 12
  min_delta: 1.0e-06
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/vit_spectrogram_paper_accurate.ts
  write_inference_config: false

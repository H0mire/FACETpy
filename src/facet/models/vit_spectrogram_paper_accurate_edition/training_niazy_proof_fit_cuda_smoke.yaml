# PAPER-ACCURATE ViTSpectrogram edition -- CUDA fleet SMOKE (1 epoch, max_examples capped).
# Same paper-scale architecture as the full config; verifies worktree sync, dataset
# build, CUDA uv-run, checkpoint/loss.png/TorchScript export before the long run.
# See docs/research/run_4_paper_accurate_editions_fleet.md.

model:
  framework: pytorch
  factory: facet.models.vit_spectrogram_paper_accurate_edition.training:build_model
  kwargs:
    n_fft: 64
    hop_length: 16
    freq_bins: 32
    time_frames: 224
    patch_freq: 4
    patch_time: 16
    embed_dim: 192
    depth: 6
    n_heads: 6
    mlp_ratio: 4.0
    dropout: 0.0
    decoder_embed_dim: 96
    decoder_depth: 2
    decoder_heads: 4
    decoder_mlp_ratio: 4.0
    mask_margin_patches: 1
  loss_factory: facet.models.vit_spectrogram_paper_accurate_edition.training:build_loss
  loss_kwargs:
    name: mse
    epoch_samples: 512
    context_epochs: 7
    n_fft: 64
    hop_length: 16
    freq_bins: 32
    time_frames: 224
    patch_freq: 4
    patch_time: 16
    mask_margin_patches: 1
    normalize_target: true
  device: cuda
data:
  dataset_factory: facet.models.vit_spectrogram_paper_accurate_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    context_epochs: 7
    demean_input: true
    demean_target: true
    max_examples: 256
  eeg_only: true
training:
  model_name: ViTSpectrogramPaperAccurateCudaSmoke
  chunk_size: 512
  target_type: clean
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 1
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.05
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
checkpoint:
  monitor: loss
  mode: min
  save_top_k: 1
  save_last: true
early_stopping:
  monitor: loss
  mode: min
  patience: 5
  min_delta: 1.0e-06
logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/vit_spectrogram_paper_accurate_cuda_smoke.ts
  write_inference_config: false

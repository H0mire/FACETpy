# IC-U-Net deployment edition -- CUDA training on the Niazy proof-fit dataset.
#
# Differs from src/facet/models/ic_unet/training_niazy_proof_fit.yaml in the
# objective, not the architecture. See training.py for why.
#
# Build the dataset once per worker:
#   uv run python examples/dataset_building/build_niazy_proof_fit_context_dataset.py \
#     --artifact-bundle output/artifact_libraries/niazy_aas_2x_direct/niazy_aas_direct_artifact.npz \
#     --target-epoch-samples 512 --context-epochs 7 \
#     --output-dir output/niazy_proof_fit_context_512
#
# Train:
#   uv run facet-train fit --config src/facet/models/ic_unet_deployment_edition/training_niazy_proof_fit.yaml

model:
  framework: pytorch
  factory: facet.models.ic_unet_deployment_edition.training:build_model
  kwargs:
    n_channels: 30
    context_epochs: 7
    epoch_samples: 512
    base_channels: 64
    fit_ica: true
    ica_random_state: 0
    demean_output: true
    dataset_path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
  loss_factory: facet.models.ic_unet_deployment_edition.training:build_loss
  loss_kwargs:
    name: recovered_clean
    # Chuang et al. publish [1, 1, 1, 1]. Three of those carry over unchanged;
    # the frequency weight does not, and the deviation is measured rather than
    # guessed. Normalising each term by the clean signal's own energy makes them
    # agree at the two anchors (0.0 when perfect, exactly 1.0 when the signal is
    # deleted) but not in between: at the identity initialisation, where training
    # actually starts, the time-domain terms read 8.79 / 6.17 / 5.83 and the
    # frequency term reads 151.6 -- 22x the mean of the other three. Left at 1.0
    # it would be 87 % of the initial gradient, and IC-U-Net's own ablation puts a
    # frequency-magnitude-only objective at -1.14 dB, i.e. worse than no
    # correction at all. 6.93 / 151.6 = 0.046 equalises them at that point.
    amplitude_weight: 1.0
    velocity_weight: 1.0
    acceleration_weight: 1.0
    frequency_weight: 0.046
    si_sdr_weight: 1.0
    si_sdr_max: 30.0
    freq_band: [1.0, 70.0]
  device: cuda

data:
  dataset_factory: facet.models.ic_unet_deployment_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
  eeg_only: true

training:
  model_name: IcUnetDeploymentNiazyProofFit
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 120
  batch_size: 16
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output

checkpoint:
  # val_loss, not loss: ranking on the training loss cannot see overfitting, and
  # three of the failing editions were checkpointed on it.
  monitor: val_loss
  mode: min
  save_top_k: 2
  save_last: true

early_stopping:
  monitor: val_loss
  mode: min
  patience: 20
  # Relative, not absolute. The base edition asked for an absolute 1e-06
  # improvement; whether that is "any improvement at all" or "impossible"
  # depends entirely on the loss scale, and nothing warned which.
  min_delta: 0.0
  min_delta_rel: 0.001

logging:
  rich_live: false
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true

export:
  enabled: true
  format: torchscript
  path: exports/ic_unet_deployment.ts
  example_input_shape: [1, 30, 3584]
  write_inference_config: false

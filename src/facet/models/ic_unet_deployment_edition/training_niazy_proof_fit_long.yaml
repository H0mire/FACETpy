# ic_unet deployment edition -- long-budget run.
#
# Identical to training_niazy_proof_fit.yaml except for the epoch ceiling
# and patience. It exists because the first pass was budget-limited:
# ic_unet's best epoch was 120 of 120, still improving when the run ended.
# A run that max_epochs stopped says nothing about convergence, so the
# ceiling is raised until early stopping is what ends it.
#
# 833 examples per epoch -> ceiling 1500, patience 40.

model:
  framework: pytorch
  factory: facet.models.ic_unet_deployment_edition.training:build_model
  kwargs:
    n_channels: 30
    context_epochs: 7
    epoch_samples: 512
    base_channels: 64
    fit_ica: true
    ica_random_state: 0
    demean_output: true
    dataset_path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
  loss_factory: facet.models.ic_unet_deployment_edition.training:build_loss
  loss_kwargs:
    name: recovered_clean
    amplitude_weight: 1.0
    velocity_weight: 1.0
    acceleration_weight: 1.0
    frequency_weight: 0.046
    si_sdr_weight: 1.0
    si_sdr_max: 30.0
    freq_band:
    - 1.0
    - 70.0
  device: cuda
data:
  dataset_factory: facet.models.ic_unet_deployment_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
  eeg_only: true
training:
  model_name: IcUnetDeploymentNiazyProofFitLong
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 1500
  batch_size: 16
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 2
  save_last: true
early_stopping:
  monitor: val_loss
  mode: min
  patience: 40
  min_delta: 0.0
  min_delta_rel: 0.001
logging:
  rich_live: false
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true
export:
  enabled: true
  format: torchscript
  path: exports/ic_unet_deployment_long.ts
  example_input_shape:
  - 1
  - 30
  - 3584
  write_inference_config: false

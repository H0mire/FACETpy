# ic_unet deployment edition -- long budget, seed 43.
# The short budget stopped seed 42 at 4.058 while it was still improving;
# the long one reached 0.676. Only long-budget runs are comparable.

checkpoint:
  mode: min
  monitor: val_loss
  save_last: true
  save_top_k: 2
data:
  dataset_factory: facet.models.ic_unet_deployment_edition.training:build_dataset
  eeg_only: true
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
early_stopping:
  min_delta: 0.0
  min_delta_rel: 0.001
  mode: min
  monitor: val_loss
  patience: 40
export:
  enabled: true
  example_input_shape:
  - 1
  - 30
  - 3584
  format: torchscript
  path: exports/ic_unet_deployment_long_seed43.ts
  write_inference_config: false
logging:
  log_file: training.jsonl
  loss_plot_file: loss.png
  progress_bar: true
  rich_live: false
  val_every_n_epochs: 1
model:
  device: cuda
  factory: facet.models.ic_unet_deployment_edition.training:build_model
  framework: pytorch
  kwargs:
    base_channels: 64
    context_epochs: 7
    dataset_path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    demean_output: true
    epoch_samples: 512
    fit_ica: true
    ica_random_state: 0
    n_channels: 30
  loss_factory: facet.models.ic_unet_deployment_edition.training:build_loss
  loss_kwargs:
    acceleration_weight: 1.0
    amplitude_weight: 1.0
    freq_band:
    - 1.0
    - 70.0
    frequency_weight: 0.046
    name: recovered_clean
    si_sdr_max: 30.0
    si_sdr_weight: 1.0
    velocity_weight: 1.0
training:
  batch_size: 16
  chunk_size: 512
  grad_clip_norm: 1.0
  learning_rate: 0.0005
  max_epochs: 1500
  model_name: IcUnetDeploymentNiazyProofFitLongSeed43
  output_dir: training_output
  seed: 43
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  weight_decay: 0.0001

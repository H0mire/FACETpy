# Paper-accurate ST-GNN smoke training run. Single epoch on a tiny subset
# to verify worktree sync, dataset preparation, checkpoint writing,
# training.jsonl, loss.png, and TorchScript export end-to-end on CPU.
#
# ILLUSTRATIVE ONLY -- this YAML is NOT executed by the pytest smoke test.
# Every dimension is an order of magnitude below the production 7/30/512.

model:
  framework: pytorch
  factory: facet.models.st_gnn_paper_accurate_edition.training:build_model
  kwargs:
    hidden_channels: 8        # paper sandwich widens here (paper: 64)
    bottleneck_channels: 4    # spatial Cheb squeezes here (paper: 16)
    time_kernel: 3            # K_t = 3 (STGCN)
    k_order: 3                # Chebyshev order K = 3 (STGCN); set 1 for Kipf
    dropout: 0.0
    knn_k: 4
    causal: false             # length-preserving head (documented deviation)
  loss_factory: facet.models.st_gnn_paper_accurate_edition.training:build_loss
  loss_kwargs:
    name: mse                 # STGCN L2 objective (Eq. 9)
  device: cpu

data:
  dataset_factory: facet.models.st_gnn_paper_accurate_edition.training:build_dataset
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    max_examples: 16
    demean_input: true
    demean_target: true
  eeg_only: true

training:
  model_name: PaperAccurateSpatiotemporalGNNSmoke
  chunk_size: 512
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  max_epochs: 1
  batch_size: 4
  learning_rate: 0.001        # STGCN Adam lr = 1e-3
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  output_dir: training_output
  # STGCN recommends 0.7 LR decay every 5 epochs (Sec. 4). The LR schedule
  # is owned by facet-train; enable a step scheduler there for full fidelity.

checkpoint:
  monitor: loss
  mode: min
  save_top_k: 1
  save_last: true

early_stopping:
  monitor: loss
  mode: min
  patience: 10
  min_delta: 0.000001

logging:
  rich_live: true
  log_file: training.jsonl
  loss_plot_file: loss.png
  val_every_n_epochs: 1
  progress_bar: true

export:
  enabled: true
  format: torchscript
  path: exports/st_gnn_paper_accurate.ts
  write_inference_config: false

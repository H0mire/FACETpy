# D4PM deployment edition -- context axis: epochs.
#
# The base contract is one epoch of one electrode, which
# run_7_paper_strict_rebuild.md names as a rule violation: never one
# epoch AND one channel. This run gives it 7 epochs concatenated into one
# 3584-sample signal.
#
# The epsilon objective still covers the whole noised tensor -- only the
# waveform term is reduced to what the target describes. Scoring epsilon on
# the centre epoch alone would train the diffusion on a seventh of its own
# input.

checkpoint:
  mode: min
  monitor: val_loss
  save_last: true
  save_top_k: 2
data:
  dataset_factory: facet.models.d4pm_deployment_edition.training:build_context_dataset
  eeg_only: true
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
    axis: epochs
early_stopping:
  min_delta: 0.0
  min_delta_rel: 0.001
  mode: min
  monitor: val_loss
  patience: 60
export:
  enabled: true
  example_input_shape:
  - 1
  - 2
  - 512
  format: torchscript
  path: exports/d4pm_deployment_ctx_epochs_seed43.ts
  write_inference_config: false
logging:
  log_file: training.jsonl
  loss_plot_file: loss.png
  progress_bar: true
  rich_live: true
  val_every_n_epochs: 1
model:
  device: cuda
  factory: facet.models.d4pm_deployment_edition.training:build_context_model
  framework: pytorch
  kwargs:
    beta_end: 0.02
    beta_start: 0.0001
    d_ff: 512
    d_model: 128
    demean_output: true
    embed_dim: 128
    epoch_samples: 512
    feats: 64
    n_heads: 2
    n_layers: 2
    num_steps: 200
    waveform_t_fraction: 0.25
    axis: epochs
  loss_factory: facet.models.d4pm_deployment_edition.training:build_loss
  loss_kwargs:
    acceleration_weight: 1.0
    amplitude_weight: 1.0
    eps_weight: 1.0
    freq_band:
    - 1.0
    - 70.0
    frequency_weight: 0.046
    name: d4pm_deployment
    si_sdr_max: 30.0
    si_sdr_weight: 1.0
    velocity_weight: 1.0
    waveform_weight: 1.0
training:
  batch_size: 64
  chunk_size: 512
  grad_clip_norm: 1.0
  learning_rate: 0.001
  max_epochs: 300
  model_name: D4pmDeploymentCtxEpochsSeed43
  output_dir: training_output
  seed: 43
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  weight_decay: 0.0001

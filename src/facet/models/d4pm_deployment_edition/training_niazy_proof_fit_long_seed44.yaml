# D4PM deployment edition -- long budget, seed 44.
#
# The 30-epoch runs land at 0.20-0.70, the only family still above zero,
# and seed 44 stopped at 30 of 30 while still improving. A ceiling that
# ends the run is a lower bound, not a measurement.

checkpoint:
  mode: min
  monitor: val_loss
  save_last: true
  save_top_k: 2
data:
  dataset_factory: facet.models.d4pm_deployment_edition.training:build_dataset
  eeg_only: true
  kwargs:
    path: ./output/niazy_proof_fit_context_512/niazy_proof_fit_context_dataset.npz
early_stopping:
  min_delta: 0.0
  min_delta_rel: 0.001
  mode: min
  monitor: val_loss
  patience: 40
export:
  enabled: true
  example_input_shape:
  - 1
  - 2
  - 512
  format: torchscript
  path: exports/d4pm_deployment_long_seed44.ts
  write_inference_config: false
logging:
  log_file: training.jsonl
  loss_plot_file: loss.png
  progress_bar: true
  rich_live: true
  val_every_n_epochs: 1
model:
  device: cuda
  factory: facet.models.d4pm_deployment_edition.training:build_model
  framework: pytorch
  kwargs:
    beta_end: 0.02
    beta_start: 0.0001
    d_ff: 512
    d_model: 128
    demean_output: true
    embed_dim: 128
    epoch_samples: 512
    feats: 64
    n_heads: 2
    n_layers: 2
    num_steps: 200
    waveform_t_fraction: 0.25
  loss_factory: facet.models.d4pm_deployment_edition.training:build_loss
  loss_kwargs:
    acceleration_weight: 1.0
    amplitude_weight: 1.0
    eps_weight: 1.0
    freq_band:
    - 1.0
    - 70.0
    frequency_weight: 0.046
    name: d4pm_deployment
    si_sdr_max: 30.0
    si_sdr_weight: 1.0
    velocity_weight: 1.0
    waveform_weight: 1.0
training:
  batch_size: 64
  chunk_size: 512
  grad_clip_norm: 1.0
  learning_rate: 0.001
  max_epochs: 300
  model_name: D4pmDeploymentLongSeed44
  output_dir: training_output
  seed: 44
  target_type: artifact
  trigger_aligned: true
  val_ratio: 0.2
  weight_decay: 0.0001

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff from the project lock
        run: |
          python - <<'PYTHON'
          import subprocess
          import sys
          import tomllib
          with open("uv.lock", "rb") as handle:
              lock = tomllib.load(handle)
          version = next(package["version"] for package in lock["package"] if package["name"] == "ruff")
          subprocess.run([sys.executable, "-m", "pip", "install", f"ruff=={version}"], check=True)
          PYTHON
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -m "not slow and not requires_data and not requires_c_extension" --tb=short -q

  test-deeplearning:
    # Default development installs cover PyTorch; this job also exercises TensorFlow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies (deep-learning extra)
        run: uv sync --locked --extra deeplearning
      - name: Run tests with torch/TF available
        run: uv run pytest -m "not slow and not requires_data and not requires_c_extension" --tb=short -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies (docs extras)
        run: uv sync --locked --extra docs
      - name: Documentation snippet smoke test
        run: uv run python scripts/docs_snippet_smoke.py
      - name: Check thesis catalog and generated indexes
        run: |
          uv run python -m masterthesis_guide.reproduce validate
          uv run python -m masterthesis_guide.reproduce index --check
      - name: Check model diagram sources and generated SVGs
        run: uv run python tools/diagrams/build_model_diagrams.py --check
      - name: Build docs (warnings as errors)
        run: uv run sphinx-build -W -b html docs/source docs/build
